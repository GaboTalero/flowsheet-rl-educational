name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra dev --python 3.13
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Check public repository links and paths
        run: uv run python scripts/check_repository.py
      - name: Test
        run: uv run --extra dev pytest -q
