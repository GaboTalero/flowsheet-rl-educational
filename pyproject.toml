[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowsheet-rl"
version = "0.1.0"
description = "Educational graph-based hierarchical PPO for analytical flowsheet construction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Talero" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3", "gymnasium>=1.1,<2", "networkx>=3.4,<4",
  "torch>=2.6,<3", "torch-geometric>=2.6,<3", "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[project.scripts]
flowsheet-rl = "flowsheet_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flowsheet_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".runtime", "runs"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
