environment:
  fidelity: source
  max_units: 8
  max_steps: 16
model:
  hidden_dim: 32
  layers: 2
train:
  seed: 7
  updates: 4
  rollout_steps: 64
  epochs: 2
  minibatch_size: 16
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
